<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Logowanie</title>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', Arial, sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .login-glass {
      background: rgba(255,255,255,0.75);
      box-shadow: 0 8px 32px 0 rgba(31,38,135,0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 18px;
      padding: 48px 36px 36px 36px;
      width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      animation: floatIn 1s cubic-bezier(.68,-0.55,.27,1.55);
    }

    @keyframes floatIn {
      from { transform: translateY(40px) scale(0.95); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }

    .login-glass .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px rgba(102,166,255,0.18);
    }

    .login-glass .logo svg {
      width: 38px;
      height: 38px;
      fill: #fff;
    }

    .login-glass h2 {
      text-align: center;
      margin-bottom: 28px;
      color: #333;
      font-weight: 700;
      letter-spacing: 1px;
      font-size: 1.6em;
    }

    .login-glass input[type="text"],
    .login-glass input[type="password"] {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 18px;
      border: none;
      border-radius: 9px;
      background: rgba(255,255,255,0.85);
      box-shadow: 0 1px 4px rgba(102,166,255,0.08);
      font-size: 1em;
      transition: box-shadow 0.2s;
      outline: none;
    }

    .login-glass input[type="text"]:focus,
    .login-glass input[type="password"]:focus {
      box-shadow: 0 2px 8px rgba(102,166,255,0.18);
      background: #fff;
    }

    .login-glass input[type="submit"] {
      width: 100%;
      padding: 13px 0;
      background: linear-gradient(90deg, #66a6ff 0%, #89f7fe 100%);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 1.1em;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(102,166,255,0.12);
      transition: background 0.2s, transform 0.1s;
      margin-top: 6px;
      letter-spacing: 1px;
    }

    .login-glass input[type="submit"]:hover {
      background: linear-gradient(90deg, #4f8cff 0%, #66a6ff 100%);
      transform: translateY(-2px) scale(1.03);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #666;
      text-decoration: none;
      font-size: 1em;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #4f8cff;
      text-decoration: underline;
    }

    /* Subtle floating animation for background */
    .bg-float {
      position: absolute;
      width: 600px;
      height: 600px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: -1;
      pointer-events: none;
      opacity: 0.18;
      filter: blur(40px);
      background: radial-gradient(circle at 60% 40%, #66a6ff 0%, #fff 80%);
      animation: bgFloat 10s infinite alternate ease-in-out;
    }
    @keyframes bgFloat {
      0% { transform: translate(-50%, -50%) scale(1);}
      100% { transform: translate(-50%, -48%) scale(1.08);}
    }
  </style>
</head>
<body>
  <div class="bg-float"></div>
  <div class="login-glass">
    <div class="logo">
      <!-- DNA SVG icon -->
      <svg viewBox="0 0 64 64">
        <path d="M32 6c-7.7 0-14 6.3-14 14 0 7.2 5.1 13.2 12 14.7V38c-6.9 1.5-12 7.5-12 14.7 0 7.7 6.3 14 14 14s14-6.3 14-14c0-7.2-5.1-13.2-12-14.7V26.7c6.9-1.5 12-7.5 12-14.7C46 12.3 39.7 6 32 6zm0 4c5.5 0 10 4.5 10 10 0 5.1-3.8 9.3-8.7 9.9l-.3.1V38.1l.3.1C38.2 38.7 42 42.9 42 48c0 5.5-4.5 10-10 10s-10-4.5-10-10c0-5.1 3.8-9.3 8.7-9.9l.3-.1V25.9l-.3-.1C25.8 25.3 22 21.1 22 16c0-5.5 4.5-10 10-10z"/>
      </svg>
    </div>
    <h2>Zaloguj się</h2>
    <form method="post" action="/login">
      <input type="text" name="username" placeholder="Nazwa użytkownika" required>
      <input type="password" name="password" placeholder="Hasło" required>
      <input type="submit" value="Zaloguj">
    </form>
    <a class="back-link" href="/">← Powrót do strony głównej</a>
  </div>
</body>
</html>
